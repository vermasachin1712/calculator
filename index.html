<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc">
  <div class="display">
    <div id="history"></div>
    <div id="screen">0</div>
  </div>

  <div class="keys" id="keys">
    <button class="fn" data-key="C">C</button>
    <button class="fn" data-key="Backspace">⌫</button>
    <button class="fn" data-key="%">%</button>
    <button class="op" data-key="/">÷</button>

    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button class="op" data-key="*">×</button>

    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button class="op" data-key="-">−</button>

    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button class="op" data-key="+">+</button>

    <button class="fn" data-key="neg">±</button>
    <button data-key="0">0</button>
    <button data-key=".">.</button>
    <button class="eq" data-key="=">=</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
